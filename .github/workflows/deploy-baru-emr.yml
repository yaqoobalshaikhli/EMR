name: Deploy Baru EMR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docker/baru/**"
      - "custom/branding/**"
      - "interface/themes/**"
      - "sites/default/images/logos/**"
      - "scripts/deploy-baru-emr.sh"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.BARU_DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H "${{ secrets.BARU_DEPLOY_HOST }}" >> "$HOME/.ssh/known_hosts"
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.BARU_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.BARU_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.BARU_DEPLOY_PATH }}
          DEPLOY_DOMAIN: baru-healthservices.com
        run: ./scripts/deploy-baru-emr.sh
